<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Guru - Manajemen Kuis & Nilai DKV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #111827;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .hidden { display: none !important; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 850px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        #layar-login { max-width: 350px; margin-top: 15vh; text-align: center; }
        h2, h3 { color: #facc15; margin-top: 0; }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 6px;
            font-family: 'Poppins';
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        input:focus, textarea:focus { border-color: #facc15; outline: none; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .tab-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #9ca3af; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Poppins'; font-weight: 500;
        }
        .tab-btn.active { background: #ea580c; color: white; border-color: #ea580c; }

        .btn {
            background: linear-gradient(135deg, #ea580c, #dc2626);
            color: white; padding: 12px; border: none; border-radius: 6px;
            font-weight: 600; cursor: pointer; width: 100%; font-family: 'Poppins';
        }
        .btn-add { background: #10b981; margin-bottom: 20px; width: auto; padding: 10px 20px; }
        .btn-excel { background: #16a34a; width: auto; padding: 10px 20px; margin-bottom: 20px; }
        .btn-download { background: #2563eb; width: auto; padding: 10px 20px; margin-bottom: 20px; text-decoration: none; display: inline-block; font-size: 14px; color: white; border-radius: 6px; font-weight: 600; text-align: center;}
        .btn-save { background: #0284c7; margin-top: 15px; }
        .btn-logout { background: #4b5563; width: auto; padding: 6px 15px; font-size: 12px; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .soal-row {
            background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative;
        }
        .btn-delete {
            position: absolute; right: 15px; top: 15px; background: #ef4444; color: white; border: none;
            border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 12px;
        }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .info-link { font-size: 11px; color: #9ca3af; margin-top: -10px; margin-bottom: 10px; display: block; }

        .excel-panel {
            background: rgba(255,255,255,0.02);
            border: 2px dashed rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background-color: rgba(255,255,255,0.05); color: #facc15; font-weight: 600; }
        tr:hover { background-color: rgba(255,255,255,0.02); }
        
        .skor-lulus { color: #10b981; font-weight: bold; }
        .skor-gagal { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div id="layar-login" class="glass-effect">
        <h3>Login Panel Guru</h3>
        <input type="email" id="email-guru" placeholder="Email Guru...">
        <input type="password" id="pass-guru" placeholder="Password...">
        <button id="btn-login-guru" class="btn">Masuk ke Panel</button>
    </div>

    <div id="layar-utama" class="glass-effect hidden">
        <div class="header-admin">
            <h2><i class="fas fa-chalkboard-teacher"></i> Panel Utama Control Guru</h2>
            <button id="btn-logout-guru" class="btn btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" id="tab-soal"><i class="fas fa-tools"></i> Manajemen Soal</button>
            <button class="tab-btn" id="tab-nilai"><i class="fas fa-graduation-cap"></i> Hasil / Live Score Siswa</button>
        </div>
        
        <div id="konten-soal">
            <p style="font-size: 13px; color: #d1d5db;">Silakan atur soal secara manual atau langsung unggah file Excel untuk memperbarui bank soal secara massal.</p>
            
            <div class="excel-panel">
                <button id="btn-unduh-templat" class="btn-download"><i class="fas fa-file-download"></i> Unduh Format Excel</button>
                <div style="flex: 1; min-width: 200px;">
                    <input type="file" id="input-file-excel" accept=".xlsx, .xls" style="margin-bottom: 0; padding: 7px;">
                </div>
                <button id="btn-proses-excel" class="btn btn-excel"><i class="fas fa-file-upload"></i> Proses File</button>
            </div>

            <div style="margin-bottom: 15px;">
                <button id="btn-tambah-baris" class="btn btn-add"><i class="fas fa-plus"></i> Tambah Manual</button>
            </div>
            
            <div id="container-list-soal">
                </div>
            <button id="btn-simpan-semua" class="btn btn-save"><i class="fas fa-save"></i> Simpan & Publikasikan Soal</button>
        </div>

        <div id="konten-nilai" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <p style="font-size: 13px; color: #d1d5db; margin: 0;">Daftar rekapitulasi nilai ujian masuk secara real-time dari pengerjaan siswa.</p>
                <span style="font-size: 11px; background: rgba(16,185,129,0.2); color: #10b981; padding: 4px 8px; border-radius: 20px; font-weight: 500;"><i class="fas fa-sync-alt fa-spin"></i> Terhubung Live</span>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama / Email Siswa</th>
                            <th>Nilai Ujian</th>
                            <th>Waktu Selesai</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-live-score">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, setDoc, getDoc, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const layarLogin = document.getElementById('layar-login');
        const layarUtama = document.getElementById('layar-utama');
        const emailGuru = document.getElementById('email-guru');
        const passGuru = document.getElementById('pass-guru');
        const btnLoginGuru = document.getElementById('btn-login-guru');
        const btnLogoutGuru = document.getElementById('btn-logout-guru');
        
        const tabSoal = document.getElementById('tab-soal');
        const tabNilai = document.getElementById('tab-nilai');
        const kontenSoal = document.getElementById('konten-soal');
        const kontenNilai = document.getElementById('konten-nilai');

        const containerListSoal = document.getElementById('container-list-soal');
        const btnTambahBaris = document.getElementById('btn-tambah-baris');
        const btnSimpanSemua = document.getElementById('btn-simpan-semua');
        const tabelLiveScore = document.getElementById('tabel-live-score');

        const btnUnduhTemplat = document.getElementById('btn-unduh-templat');
        const inputFileExcel = document.getElementById('input-file-excel');
        const btnProsesExcel = document.getElementById('btn-proses-excel');

        // SISTEM PROTEKSI DOSEN/GURU
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const emailUser = user.email.toLowerCase();
                if (emailUser.includes('guru') || emailUser.endsWith('@smk.sch.id')) {
                    layarLogin.classList.add('hidden');
                    layarUtama.classList.remove('hidden');
                    muatDataSoalDariFirebase();
                    aktifkanLiveScoreListener();
                } else {
                    alert("Akses Ditolak! Akun Anda terdeteksi sebagai akun siswa.");
                    signOut(auth);
                }
            } else {
                layarUtama.classList.add('hidden');
                layarLogin.classList.remove('hidden');
            }
        });

        // INTEGRASI BARU: Fitur Tekan Enter untuk Memicu Login Otomatis Guru
        const tanganiEnterLoginGuru = (event) => {
            if (event.key === 'Enter') {
                event.preventDefault(); 
                btnLoginGuru.click(); 
            }
        };
        emailGuru.addEventListener('keydown', tanganiEnterLoginGuru);
        passGuru.addEventListener('keydown', tanganiEnterLoginGuru);

        tabSoal.addEventListener('click', () => {
            tabSoal.classList.add('active'); tabNilai.classList.remove('active');
            kontenSoal.classList.remove('hidden'); kontenNilai.classList.add('hidden');
        });

        tabNilai.addEventListener('click', () => {
            tabNilai.classList.add('active'); tabSoal.classList.remove('active');
            kontenNilai.classList.remove('hidden'); kontenSoal.classList.add('hidden');
        });

        btnLoginGuru.addEventListener('click', () => {
            const email = emailGuru.value.trim();
            const password = passGuru.value.trim();
            if(!email || !password) return alert("Isi semua kolom!");
            
            if(!email.toLowerCase().includes('guru') && !email.toLowerCase().endsWith('@smk.sch.id')) {
                return alert("Gagal! Gunakan akun email resmi Guru untuk masuk.");
            }

            signInWithEmailAndPassword(auth, email, password).catch(() => alert("Login Gagal! Password salah atau tidak terdaftar."));
        });

        btnLogoutGuru.addEventListener('click', () => {
            if(confirm("Keluar dari panel guru?")) signOut(auth).then(() => window.location.reload());
        });

        // Format Unduh Excel
        btnUnduhTemplat.addEventListener('click', () => {
            const dataTemplat = [
                { "Nama Tool": "Pen Tool", "Class Icon FontAwesome": "fas fa-pen-nib", "Teks Definisi": "Membuat jalur vektor presisi menggunakan titik-titik jangkar." },
                { "Nama Tool": "Move Tool", "Class Icon FontAwesome": "fas fa-arrows-up-down-left-right", "Teks Definisi": "Memilih, menggeser posisi, memutar, atau mengubah ukuran objek." }
            ];
            
            const worksheet = XLSX.utils.json_to_sheet(dataTemplat);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Soal Kuis");
            XLSX.writeFile(workbook, "Format_Bank_Soal_DKV.xlsx");
        });

        // Proses Unggah Excel
        btnProsesExcel.addEventListener('click', () => {
            const file = inputFileExcel.files[0];
            if (!file) return alert("Pilih file Excel terlebih dahulu!");

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const namaSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[namaSheet];
                const barisData = XLSX.utils.sheet_to_json(worksheet);

                if(barisData.length === 0) return alert("File Excel kosong atau format salah!");

                if(confirm(`Berhasil membaca ${barisData.length} soal dari Excel. Timpa daftar soal saat ini di layar?`)) {
                    containerListSoal.innerHTML = ""; 
                    barisData.forEach((row, index) => {
                        const idUnik = "item" + (Date.now() + index);
                        const nama = row["Nama Tool"] || "";
                        const icon = row["Class Icon FontAwesome"] || "fas fa-shapes";
                        const definisi = row["Teks Definisi"] || "";
                        buatBarisSoalUI(idUnik, nama, icon, definisi);
                    });
                    alert("Berhasil memuat data ke layar. Jangan lupa klik 'Simpan & Publikasikan Soal' di bawah!");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function aktifkanLiveScoreListener() {
            const q = query(collection(db, "hasil_ujian"), orderBy("waktuUjian", "desc"));
            onSnapshot(q, (snapshot) => {
                tabelLiveScore.innerHTML = "";
                if (snapshot.empty) {
                    tabelLiveScore.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#9ca3af;">Belum ada siswa yang mengumpulkan.</td></tr>`;
                    return;
                }
                let nomor = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const nilai = data.nilai;
                    const classWarnaNilai = (nilai < 75) ? "skor-gagal" : "skor-lulus";
                    let waktuString = "-";
                    if (data.waktuUjian) {
                        waktuString = data.waktuUjian.toDate().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
                    }
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${nomor++}</td><td style="font-weight:500;">${data.namaSiswa}</td><td class="${classWarnaNilai}">${nilai}</td><td>${waktuString} WIB</td>`;
                    tabelLiveScore.appendChild(row);
                });
            });
        }

        function buatBarisSoalUI(idItem, namaTool, ikonFa, teksDefinisi) {
            const div = document.createElement('div');
            div.className = 'soal-row';
            div.setAttribute('data-id-item', idItem);
            div.innerHTML = `
                <button class="btn-delete" type="button" onclick="this.parentElement.remove()"><i class="fas fa-trash"></i> Hapus</button>
                <h4 style="margin:0 0 10px 0; color:#facc15;">Soal (ID Target: ${idItem})</h4>
                <div class="grid-3">
                    <div>
                        <label style="font-size:12px; color:#9ca3af;">Nama Tool</label>
                        <input type="text" class="input-nama-tool" value="${namaTool}">
                    </div>
                    <div>
                        <label style="font-size:12px; color:#9ca3af;">Class Icon</label>
                        <input type="text" class="input-icon-tool" value="${ikonFa}">
                    </div>
                    <div>
                        <label style="font-size:12px; color:#9ca3af;">ID Unik</label>
                        <input type="text" class="input-id-tool" value="${idItem}" disabled style="background:rgba(255,255,255,0.05); color:#9ca3af;">
                    </div>
                </div>
                <label style="font-size:12px; color:#9ca3af;">Teks Definisi</label>
                <textarea class="input-definisi" rows="2">${teksDefinisi}</textarea>
            `;
            containerListSoal.appendChild(div);
        }

        btnTambahBaris.addEventListener('click', () => {
            buatBarisSoalUI("item" + Date.now(), "", "fas fa-shapes", "");
        });

        async function muatDataSoalDariFirebase() {
            containerListSoal.innerHTML = "<p id='loading-text'>Mengunduh bank soal...</p>";
            try {
                const docRef = doc(db, "bank_soal", "kuis_affinity");
                const docSnap = await getDoc(docRef);
                if(document.getElementById('loading-text')) document.getElementById('loading-text').remove();

                if (docSnap.exists()) {
                    docSnap.data().data.forEach(soal => buatBarisSoalUI(soal.id, soal.nama, soal.icon, soal.definisi));
                } else {
                    containerListSoal.innerHTML = "<p style='color:#9ca3af;'>Belum ada data soal di server.</p>";
                }
            } catch (error) {
                containerListSoal.innerHTML = "<p style='color:#ef4444;'>Gagal mengunduh struktur soal.</p>";
            }
        }

        btnSimpanSemua.addEventListener('click', async () => {
            const rows = containerListSoal.querySelectorAll('.soal-row');
            if(rows.length === 0) return alert("Minimal harus ada 1 soal!");

            const arrayDataSoal = [];
            rows.forEach(row => {
                const idItem = row.getAttribute('data-id-item');
                const namaTool = row.querySelector('.input-nama-tool').value.trim();
                const iconTool = row.querySelector('.input-icon-tool').value.trim();
                const definisiTeks = row.querySelector('.input-definisi').value.trim();
                if(namaTool && iconTool && definitionsTeks || (namaTool && iconTool && definisiTeks)) {
                    arrayDataSoal.push({ id: idItem, nama: namaTool, icon: iconTool, definisi: definisiTeks });
                }
            });

            if(arrayDataSoal.length !== rows.length) return alert("Lengkapi semua kolom input!");

            try {
                await setDoc(doc(db, "bank_soal", "kuis_affinity"), { data: arrayDataSoal, diperbaruiPada: new Date() });
                alert("Sukses! Bank soal kuis berhasil diperbarui.");
                window.location.reload();
            } catch (e) { alert("Gagal menyimpan: " + e.message); }
        });
    </script>
</body>
</html>
